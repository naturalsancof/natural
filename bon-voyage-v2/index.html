<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#264653" />
    <title>Bon voyage · 旅行留言板</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <p class="eyebrow">TRAVEL NOTES</p>
        <h1>Bon voyage</h1>
        <p class="subtitle">留下此刻，带走回忆。</p>
      </header>

      <section class="composer card" aria-labelledby="composer-title">
        <div class="section-heading">
          <h2 id="composer-title">写一则旅途留言</h2>
          <p>昵称必填，文字或图片至少选一项。</p>
        </div>
        <form id="note-form" novalidate>
          <label for="author">昵称 <span aria-hidden="true">*</span></label>
          <input id="author" name="author" type="text" maxlength="60" autocomplete="nickname" required placeholder="例如：小林" />

          <label for="content">想记录什么？</label>
          <textarea id="content" name="content" maxlength="2000" rows="5" placeholder="今天的风、路上的人，或一个值得纪念的瞬间…"></textarea>

          <label for="img-file">照片（可选）</label>
          <input id="img-file" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
          <p class="field-hint">支持 JPEG、PNG、WebP、GIF，最大 5 MB。</p>
          <div id="preview-wrap" class="preview-wrap" hidden>
            <img id="preview" class="img-preview" alt="待发布图片的预览" />
            <button id="remove-image" class="text-button" type="button">移除照片</button>
          </div>

          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          <button id="submit-button" class="primary-button" type="submit">发布留言</button>
        </form>
      </section>

      <section class="notes-section" aria-labelledby="notes-title">
        <div class="notes-heading">
          <h2 id="notes-title">旅行足迹</h2>
          <button id="retry-button" class="text-button" type="button" hidden>重新加载</button>
        </div>
        <div id="notes-status" class="status-card" role="status" aria-live="polite">正在加载留言…</div>
        <div id="notes-list" class="notes-list" aria-live="polite"></div>
      </section>
    </main>

    <template id="note-template">
      <article class="note-card card">
        <div class="note-meta">
          <strong class="note-author"></strong>
          <time class="note-time"></time>
        </div>
        <p class="note-content"></p>
        <img class="note-image" alt="留言附带的照片" hidden />
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
