<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#264653" />

    <title>Bon voyage · 旅行留言板</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="./css/style.css" />
    <script>
    try {
      var saved = localStorage.getItem('bonvoyage-theme');
      var dark = saved
        ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (dark) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (error) {
      /* 忽略：隐私模式下 localStorage 可能不可用 */
    }
  </script>

</head>

  <body>

    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="切换夜间纸感"
      title="切换夜间纸感"
    >
      <span aria-hidden="true">◐</span>
    </button>

    <main class="container">

      <!-- 页面标题 -->
      <header class="hero">
        <p class="eyebrow">TRAVEL NOTES</p>

        <h1>Bon voyage</h1>

        <p class="subtitle">
          留下此刻，带走回忆。
        </p>
      </header>


      <!-- =========================
           管理员
      ========================== -->

      <section class="admin-area">

        <!-- 平时只显示这个按钮 -->
        <button
          id="admin-toggle"
          class="admin-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="admin-panel"
        >
          管理员
        </button>


        <!-- 点击管理员后才显示 -->
        <div
          id="admin-panel"
          class="admin-panel"
          hidden
        >

          <div class="section-heading">

            <h2 id="admin-heading">管理员登录</h2>

            <p id="admin-status">
              登录后可以管理留言。
            </p>

          </div>


          <form id="admin-login-form">

            <label for="admin-email">
              邮箱
            </label>

            <input
              id="admin-email"
              type="email"
              autocomplete="username"
              placeholder="管理员邮箱"
            />


            <label for="admin-password">
              密码
            </label>

            <input
              id="admin-password"
              type="password"
              autocomplete="current-password"
              placeholder="管理员密码"
            />


            <p
              id="admin-message"
              class="form-message"
              role="status"
              aria-live="polite"
            ></p>


            <div class="admin-actions">

              <button
                id="admin-login-button"
                class="primary-button"
                type="submit"
              >
                登录
              </button>

            </div>

          </form>


          <div
            id="admin-session"
            class="admin-session"
            hidden
          >

            <button
              id="admin-logout-button"
              class="text-button"
              type="button"
            >
              退出登录
            </button>

          </div>

        </div>

      </section>


      <!-- =========================
           发布留言
      ========================== -->

      <section
        class="composer card"
        aria-label="写一则旅途留言"
      >

        <button
          id="composer-toggle"
          class="composer-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="note-form"
        >
          <span class="composer-toggle-icon" aria-hidden="true">+</span>
          <span class="composer-toggle-label">写一则旅途留言</span>
        </button>


        <form
          id="note-form"
          novalidate
          hidden
        >

          <!-- 昵称 -->

          <label for="author">
            昵称 <span aria-hidden="true">*</span>
          </label>

          <input
            id="author"
            name="author"
            type="text"
            maxlength="60"
            autocomplete="nickname"
            required
            placeholder="例如：小林"
          />


          <!-- 内容 -->

          <label for="content">
            想记录什么？
          </label>

          <textarea
            id="content"
            name="content"
            maxlength="2000"
            rows="5"
            placeholder="今天的风、路上的人，或一个值得纪念的瞬间…"
          ></textarea>


          <!-- 图片 -->

          <label for="img-file">
            照片（可选）
          </label>

          <input
            id="img-file"
            name="image"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
          />

          <p class="field-hint">
            支持 JPEG、PNG、WebP、GIF，最大 10 MB。
          </p>


          <!-- 地点 -->

          <label for="composer-location">
            地点（可选）
          </label>

          <div class="location-field">

            <button
              id="composer-location"
              class="location-button"
              type="button"
            >
              📍 添加地点
            </button>

            <span
              id="composer-location-name"
              class="location-chip"
              hidden
            ></span>

            <button
              id="composer-location-clear"
              class="text-button"
              type="button"
              hidden
            >
              移除
            </button>

          </div>


          <!-- 图片预览 -->

          <div
            id="preview-wrap"
            class="preview-wrap"
            hidden
          >

            <img
              id="preview"
              class="img-preview"
              alt="待发布图片的预览"
            />

            <button
              id="remove-image"
              class="text-button"
              type="button"
            >
              移除照片
            </button>

          </div>


          <!-- 发布状态 -->

          <p
            id="form-message"
            class="form-message"
            role="status"
            aria-live="polite"
          ></p>


          <button
            id="submit-button"
            class="primary-button"
            type="submit"
          >
            发布留言
          </button>

        </form>

      </section>


      <!-- =========================
           足迹地图
      ========================== -->

      <div class="board">

      <section
        id="map-panel"
        class="map-section"
        aria-labelledby="map-title"
      >

        <button
          id="map-close"
          class="map-close"
          type="button"
          aria-label="收起地图"
        >
          ×
        </button>

        <div class="notes-heading">

          <h2 id="map-title">
            足迹地图
          </h2>

        </div>

        <div
          class="map-card card"
          style="background: none; border: 0; box-shadow: none; padding: 0; backdrop-filter: none;"
        >

          <div
            id="map-canvas"
            class="map-canvas"
            style="background: none;"
          ></div>

          <p id="map-empty" class="map-empty">
            还没有带地点的留言，发帖时标一个位置就会出现在地图上。
          </p>

        </div>

      </section>


      <!-- =========================
           旅行足迹
      ========================== -->

      <section
        class="notes-section"
        aria-labelledby="notes-title"
      >

        <div class="notes-heading">

          <h2 id="notes-title">
            旅行足迹
          </h2>

          <button
            id="retry-button"
            class="text-button"
            type="button"
            hidden
          >
            重新加载
          </button>

        </div>


        <div
          id="notes-status"
          class="status-card"
          role="status"
          aria-live="polite"
        >
          正在加载留言…
        </div>


        <div
          id="notes-list"
          class="notes-list"
          aria-live="polite"
        ></div>


        <div class="notes-footer">

          <p
            id="load-more-status"
            class="notes-loading"
            role="status"
            aria-live="polite"
            hidden
          >
            正在加载更多…
          </p>

          <div
            id="notes-sentinel"
            class="notes-sentinel"
            aria-hidden="true"
          ></div>

        </div>

      </section>

      </div>

    </main>

    <button
      id="map-toggle"
      class="map-toggle"
      type="button"
      aria-controls="map-panel"
      aria-expanded="false"
    >
      足迹地图
    </button>

    <div id="map-scrim" class="map-scrim" hidden></div>


    <!-- =========================
         留言模板
    ========================== -->

    <template id="note-template">

      <article class="note-card card">

        <div class="note-meta">

          <strong class="note-author"></strong>

          <time class="note-time"></time>

        </div>


        <p class="note-content"></p>


        <p class="note-location" hidden></p>


        <div class="note-image-wrap">

          <img
            class="note-image"
            alt="留言附带的照片"
            hidden
          />

        </div>


        <!-- 评论 -->

        <section class="comments" aria-label="评论">

          <ul class="comment-list"></ul>

          <div class="comment-actions">

            <button
              class="edit-location-button"
              type="button"
              hidden
            >
              编辑地点
            </button>

            <button
              class="comment-toggle"
              type="button"
              aria-expanded="false"
            >
              写评论
            </button>

          </div>

          <form class="comment-form" hidden>

            <input
              class="comment-author"
              type="text"
              maxlength="60"
              placeholder="昵称"
              required
            />

            <textarea
              class="comment-content"
              rows="2"
              maxlength="1000"
              placeholder="写下你的评论…"
              required
            ></textarea>

            <div class="comment-form-row">

              <p class="comment-message" role="status" aria-live="polite"></p>

              <button class="comment-submit" type="submit">
                发表评论
              </button>

            </div>

          </form>

        </section>


        <!-- 管理员删除 -->

        <button
          class="delete-note-button"
          type="button"
          hidden
        >
          删除留言
        </button>

      </article>

    </template>


    <template id="comment-template">

      <li class="comment-item">

        <div class="comment-meta">

          <strong class="comment-author-name"></strong>

          <time class="comment-time"></time>

        </div>

        <p class="comment-text"></p>

        <button
          class="delete-comment-button"
          type="button"
          hidden
        >
          删除
        </button>

      </li>

    </template>


    <!-- =========================
         轻提示
    ========================== -->

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>


    <!-- =========================
         骨架屏模板
    ========================== -->

    <template id="skeleton-template">

      <article
        class="note-card card skeleton-card"
        aria-hidden="true"
      >

        <div class="skeleton-row">

          <span class="skeleton skeleton-avatar"></span>

          <span class="skeleton skeleton-line skeleton-name"></span>

        </div>

        <div class="skeleton skeleton-line"></div>

        <div class="skeleton skeleton-block"></div>

      </article>

    </template>


    <!-- =========================
         选择地点
    ========================== -->

    <div
      id="location-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="location-modal-title"
      aria-hidden="true"
      hidden
    >

      <div class="modal-panel">

        <div class="modal-head">

          <h2 id="location-modal-title">
            选择地点
          </h2>

          <button
            id="location-close"
            class="modal-close"
            type="button"
            aria-label="关闭"
          >
            ×
          </button>

        </div>


        <div class="location-search">

          <input
            id="location-query"
            type="search"
            placeholder="搜索城市或地名，如 大理、京都、Lisbon"
            autocomplete="off"
          />

          <button
            id="location-search-button"
            class="text-button"
            type="button"
          >
            搜索
          </button>

        </div>


        <ul
          id="location-results"
          class="location-results"
        ></ul>


        <div class="location-hint-row">

          <button
            id="location-locate"
            class="text-button"
            type="button"
          >
            📍 使用当前位置
          </button>

          <span class="location-hint">
            或直接在地图上点选
          </span>

        </div>


        <div id="location-map" class="map-canvas map-canvas-small"></div>


        <div class="location-selected">

          <span id="location-label" class="location-label">
            未选择地点
          </span>

          <button
            id="location-clear"
            class="text-button"
            type="button"
            hidden
          >
            清除
          </button>

        </div>


        <p
          id="location-message"
          class="form-message"
          role="status"
          aria-live="polite"
        ></p>


        <div class="modal-actions">

          <button
            id="location-cancel"
            class="text-button"
            type="button"
          >
            取消
          </button>

          <button
            id="location-confirm"
            class="modal-confirm primary-button"
            type="button"
            disabled
          >
            确定
          </button>

        </div>

      </div>

    </div>


    <!-- =========================
         图片大图
    ========================== -->

    <div
      id="lightbox"
      class="lightbox"
      hidden
      aria-hidden="true"
    >

      <button
        id="lightbox-close"
        class="lightbox-close"
        type="button"
        aria-label="关闭图片"
      >
        ×
      </button>


      <img
        id="lightbox-image"
        class="lightbox-image"
        alt="大图预览"
      />

    </div>


    <!-- Supabase -->

    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>


    <!-- 主程序 -->

    <script
      type="module"
      src="./js/app.js"
    ></script>

  </body>
</html>
