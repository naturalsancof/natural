<section class="admin-area">

  <!-- 平时只显示这个按钮 -->
  <button
    id="admin-toggle"
    class="admin-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="admin-panel"
  >
    管理员
  </button>

  <!-- 点击后才显示 -->
  <div id="admin-panel" class="admin-panel" hidden>

    <div class="section-heading">
      <h2>管理员登录</h2>
      <p id="admin-status">登录后可以管理留言。</p>
    </div>

    <form id="admin-login-form">

      <label for="admin-email">邮箱</label>

      <input
        id="admin-email"
        type="email"
        autocomplete="username"
        placeholder="管理员邮箱"
      />

      <label for="admin-password">密码</label>

      <input
        id="admin-password"
        type="password"
        autocomplete="current-password"
        placeholder="管理员密码"
      />

      <p
        id="admin-message"
        class="form-message"
        role="status"
        aria-live="polite"
      ></p>

      <div class="admin-actions">

        <button
          id="admin-login-button"
          class="primary-button"
          type="submit"
        >
          登录
        </button>

        <button
          id="admin-logout-button"
          class="text-button"
          type="button"
          hidden
        >
          退出登录
        </button>

      </div>

    </form>

  </div>

</section>
