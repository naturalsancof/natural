<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#264653" />

    <title>Bon voyage · 旅行留言板</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <main class="container">

      <!-- 页面标题 -->
      <header class="hero">
        <p class="eyebrow">TRAVEL NOTES</p>

        <h1>Bon voyage</h1>

        <p class="subtitle">
          留下此刻，带走回忆。
        </p>
      </header>


      <!-- =========================
           管理员
      ========================== -->

      <section class="admin-area">

        <!-- 平时只显示这个按钮 -->
        <button
          id="admin-toggle"
          class="admin-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="admin-panel"
        >
          管理员
        </button>


        <!-- 点击管理员后才显示 -->
        <div
          id="admin-panel"
          class="admin-panel"
          hidden
        >

          <div class="section-heading">

            <h2 id="admin-heading">管理员登录</h2>

            <p id="admin-status">
              登录后可以管理留言。
            </p>

          </div>


          <form id="admin-login-form">

            <label for="admin-email">
              邮箱
            </label>

            <input
              id="admin-email"
              type="email"
              autocomplete="username"
              placeholder="管理员邮箱"
            />


            <label for="admin-password">
              密码
            </label>

            <input
              id="admin-password"
              type="password"
              autocomplete="current-password"
              placeholder="管理员密码"
            />


            <p
              id="admin-message"
              class="form-message"
              role="status"
              aria-live="polite"
            ></p>


            <div class="admin-actions">

              <button
                id="admin-login-button"
                class="primary-button"
                type="submit"
              >
                登录
              </button>

            </div>

          </form>


          <div
            id="admin-session"
            class="admin-session"
            hidden
          >

            <button
              id="admin-logout-button"
              class="text-button"
              type="button"
            >
              退出登录
            </button>

          </div>

        </div>

      </section>


      <!-- =========================
           发布留言
      ========================== -->

      <section
        class="composer card"
        aria-label="写一则旅途留言"
      >

        <button
          id="composer-toggle"
          class="composer-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="note-form"
        >
          <span class="composer-toggle-icon" aria-hidden="true">+</span>
          <span class="composer-toggle-label">写一则旅途留言</span>
        </button>


        <form
          id="note-form"
          novalidate
          hidden
        >

          <!-- 昵称 -->

          <label for="author">
            昵称 <span aria-hidden="true">*</span>
          </label>

          <input
            id="author"
            name="author"
            type="text"
            maxlength="60"
            autocomplete="nickname"
            required
            placeholder="例如：小林"
          />


          <!-- 内容 -->

          <label for="content">
            想记录什么？
          </label>

          <textarea
            id="content"
            name="content"
            maxlength="2000"
            rows="5"
            placeholder="今天的风、路上的人，或一个值得纪念的瞬间…"
          ></textarea>


          <!-- 图片 -->

          <label for="img-file">
            照片（可选）
          </label>

          <input
            id="img-file"
            name="image"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
          />

          <p class="field-hint">
            支持 JPEG、PNG、WebP、GIF，最大 10 MB。
          </p>


          <!-- 图片预览 -->

          <div
            id="preview-wrap"
            class="preview-wrap"
            hidden
          >

            <img
              id="preview"
              class="img-preview"
              alt="待发布图片的预览"
            />

            <button
              id="remove-image"
              class="text-button"
              type="button"
            >
              移除照片
            </button>

          </div>


          <!-- 发布状态 -->

          <p
            id="form-message"
            class="form-message"
            role="status"
            aria-live="polite"
          ></p>


          <button
            id="submit-button"
            class="primary-button"
            type="submit"
          >
            发布留言
          </button>

        </form>

      </section>


      <!-- =========================
           旅行足迹
      ========================== -->

      <section
        class="notes-section"
        aria-labelledby="notes-title"
      >

        <div class="notes-heading">

          <h2 id="notes-title">
            旅行足迹
          </h2>

          <button
            id="retry-button"
            class="text-button"
            type="button"
            hidden
          >
            重新加载
          </button>

        </div>


        <div
          id="notes-status"
          class="status-card"
          role="status"
          aria-live="polite"
        >
          正在加载留言…
        </div>


        <div
          id="notes-list"
          class="notes-list"
          aria-live="polite"
        ></div>


        <div class="notes-footer">

          <button
            id="load-more"
            class="load-more-button"
            type="button"
            hidden
          >
            加载更多
          </button>

        </div>

      </section>

    </main>


    <!-- =========================
         留言模板
    ========================== -->

    <template id="note-template">

      <article class="note-card card">

        <div class="note-meta">

          <strong class="note-author"></strong>

          <time class="note-time"></time>

        </div>


        <p class="note-content"></p>


        <div class="note-image-wrap">

          <img
            class="note-image"
            alt="留言附带的照片"
            hidden
          />

        </div>


        <!-- 评论 -->

        <section class="comments" aria-label="评论">

          <ul class="comment-list"></ul>

          <button
            class="comment-toggle"
            type="button"
            aria-expanded="false"
          >
            写评论
          </button>

          <form class="comment-form" hidden>

            <input
              class="comment-author"
              type="text"
              maxlength="60"
              placeholder="昵称"
              required
            />

            <textarea
              class="comment-content"
              rows="2"
              maxlength="1000"
              placeholder="写下你的评论…"
              required
            ></textarea>

            <div class="comment-form-row">

              <p class="comment-message" role="status" aria-live="polite"></p>

              <button class="comment-submit" type="submit">
                发表评论
              </button>

            </div>

          </form>

        </section>


        <!-- 管理员删除 -->

        <button
          class="delete-note-button"
          type="button"
          hidden
        >
          删除留言
        </button>

      </article>

    </template>


    <template id="comment-template">

      <li class="comment-item">

        <div class="comment-meta">

          <strong class="comment-author-name"></strong>

          <time class="comment-time"></time>

        </div>

        <p class="comment-text"></p>

        <button
          class="delete-comment-button"
          type="button"
          hidden
        >
          删除
        </button>

      </li>

    </template>


    <!-- =========================
         轻提示
    ========================== -->

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>


    <!-- =========================
         骨架屏模板
    ========================== -->

    <template id="skeleton-template">

      <article
        class="note-card card skeleton-card"
        aria-hidden="true"
      >

        <div class="skeleton-row">

          <span class="skeleton skeleton-avatar"></span>

          <span class="skeleton skeleton-line skeleton-name"></span>

        </div>

        <div class="skeleton skeleton-line"></div>

        <div class="skeleton skeleton-block"></div>

      </article>

    </template>


    <!-- =========================
         图片大图
    ========================== -->

    <div
      id="lightbox"
      class="lightbox"
      hidden
      aria-hidden="true"
    >

      <button
        id="lightbox-close"
        class="lightbox-close"
        type="button"
        aria-label="关闭图片"
      >
        ×
      </button>


      <img
        id="lightbox-image"
        class="lightbox-image"
        alt="大图预览"
      />

    </div>


    <!-- Supabase -->

    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>


    <!-- 主程序 -->

    <script
      type="module"
      src="./js/app.js"
    ></script>

  </body>
</html>
